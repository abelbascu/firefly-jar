style: >
  Flat 2D children's game asset, soft rounded shapes, no hard edges, no photorealism,
  thick soft dark-navy outline, gentle pastel shading, cute and calm, for ages 4-7.
  Palette strictly: night blue #2B3A67, firefly glow #FFD166, leaf green #7BC47F,
  pink accent #F4A6B7, cream highlight #FFF4E0.
  Single centered subject, full body visible, generous empty margin around it.
  Plain flat solid pure magenta #FF00FF background, no shadow on the background,
  no gradient, no text, no border, no glow halo around the subject.

assets:
  firefly:
    v1:
      model: gemini-3.1-flash-image
      refs: [art/ref/firefly_yellow.png, art/ref/character_sheet.png]
      prompt: >
        The same firefly character as the reference: round navy head, two antennae with
        ball tips, rosy cheeks, small smile, translucent cream-outlined wings, glowing
        yellow abdomen. Gentle flying pose, three-quarter view.
      out_px: 256
    v2:
      model: gemini-3.1-flash-image
      refs: [art/ref/firefly_yellow.png]
      style_extra: >
        Extra-chubby, ultra-round toddler-toy proportions like a soft plush blob character
        (Teletubbies-like friendliness): huge round head merged with a fat pillowy body,
        tiny stubby arms, very large simple glossy eyes, big rosy cheeks, no sharp corners anywhere.
      prompt: >
        The same firefly character identity as the reference (navy head, glowing yellow
        abdomen, cream translucent wings, rosy cheeks) redesigned as a super round, squishy,
        baby-like plush blob. Tiny rounded wings. Gentle flying pose, front view.
      out_px: 256
    v3:
      model: gemini-3.1-flash-image
      refs: [art/ref/firefly_yellow.png]
      style_extra: >
        Pixar-inspired charm but still FLAT 2D vector: oversized expressive shiny eyes with
        a small white highlight, big head, soft rounded silhouette, warm friendly
        expression, subtle soft two-tone shading only, no 3D render, no realistic texture.
      prompt: >
        The same firefly character as the reference, redesigned as an endearing animated-movie
        mascot with a big round head, huge shiny eyes and a cheerful smile, rounded wings
        with soft leaf details, glowing yellow abdomen. Gentle flying pose, three-quarter view.
