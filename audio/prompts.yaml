style: >
  Very warm, gentle and soft, for a calm game for 4-7 year olds at night. Rounded,
  cozy tones (music box, soft bells, warm felt piano, gentle glass), slow and tender.
  Quiet and low volume feel. No harsh or sharp transients, no bright piercing highs,
  no loud bass, no scary or dissonant tones, no voices.

sounds:
  catch:
    v1: { type: sfx, seconds: 0.8, prompt: "a single soft glass chime twinkle, like a firefly landing in a glass jar" }
  jar_fill:
    v1: { type: sfx, seconds: 1.0, prompt: "soft rising magical shimmer, one gentle sparkle" }
  celebrate:
    v1: { type: sfx, seconds: 3.0, prompt: "happy gentle celebration jingle, music box and soft bells, short and joyful" }
  tap_miss:
    v1: { type: sfx, seconds: 0.4, prompt: "very soft muted bubble pop, barely there" }
    v2: { type: sfx, seconds: 0.5, prompt: "very soft warm muted bubble pop, tiny and gentle, barely there" }
  ambience:
    v1: { type: music, seconds: 60, prompt: "calm lullaby night garden loop, soft music box and gentle crickets, slow tempo, seamless loop" }
    v2: { type: sfx, seconds: 20, prompt: "very quiet warm night garden ambience, soft distant crickets and a faint gentle music box lullaby, calm, steady and seamless, nothing sudden" }
